<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperTruck — Driver WS Simulator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    /* [KEEP ALL YOUR EXISTING CSS HERE - UNCHANGED] */
    :root {
      --bg: #0a0c10;
      --surface: #111318;
      --panel: #161a21;
      --border: #1e2330;
      --accent: #00e5a0;
      --accent2: #ff4d6a;
      --accent3: #ffa733;
      --blue: #3d9eff;
      --text: #e4eaf4;
      --muted: #4a5568;
      --dim: #2d3448;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 1000;
    }

    .logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text);
    }

    .logo span {
      color: var(--accent);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent2);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent2);
    }

    .live-dot.active {
      animation: pulse-dot 1s infinite;
      background: var(--accent);
    }

    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1;
        transform: scale(1)
      }

      50% {
        opacity: 0.4;
        transform: scale(0.7)
      }
    }

    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #panel {
      width: 300px;
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
    }

    #panel::-webkit-scrollbar {
      width: 4px;
    }

    #panel::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .field input,
    .field select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      background: var(--dim);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 229, 160, 0.5);
    }

    .speed-val {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      min-width: 30px;
      text-align: right;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 6px;
    }

    .btn-start {
      background: var(--accent);
      color: #000;
    }

    .btn-start:hover {
      background: #00ffb3;
    }

    .btn-stop {
      background: transparent;
      color: var(--accent2);
      border: 1px solid var(--accent2);
      display: none;
    }

    .btn-stop:hover {
      background: rgba(255, 77, 106, 0.1);
    }

    .btn-reset {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-reset:hover {
      border-color: var(--muted);
      color: var(--text);
    }

    #statusCard {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 11px;
      line-height: 1.8;
      color: var(--muted);
      margin-bottom: 10px;
      min-height: 42px;
      transition: all 0.3s;
    }

    #statusCard.ok {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0, 229, 160, 0.05);
    }

    #statusCard.error {
      border-color: var(--accent2);
      color: var(--accent2);
      background: rgba(255, 77, 106, 0.05);
    }

    #statusCard.warn {
      border-color: var(--accent3);
      color: var(--accent3);
      background: rgba(255, 167, 51, 0.05);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .stat-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
      font-family: 'Barlow Condensed', sans-serif;
      color: var(--text);
    }

    .stat-value.green {
      color: var(--accent);
    }

    .stat-value.red {
      color: var(--accent2);
    }

    .stat-value.amber {
      color: var(--accent3);
    }

    .stat-value.blue {
      color: var(--blue);
    }

    .progress-wrap {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      height: 8px;
      overflow: hidden;
      margin: 10px 0;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #00b377);
      border-radius: 6px;
      width: 0%;
      transition: width 0.3s;
    }

    #logFeed {
      flex: 1;
      padding: 8px 12px 60px;
      overflow-y: auto;
      font-size: 11px;
      line-height: 1.6;
      min-height: 0;
    }

    #logFeed::-webkit-scrollbar {
      width: 3px;
    }

    #logFeed::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .log-entry {
      display: flex;
      gap: 8px;
      margin-bottom: 5px;
      padding: 5px 7px;
      border-radius: 5px;
      border-left: 2px solid transparent;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-4px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .log-entry.ok {
      border-left-color: var(--accent);
      background: rgba(0, 229, 160, 0.04);
    }

    .log-entry.error {
      border-left-color: var(--accent2);
      background: rgba(255, 77, 106, 0.04);
    }

    .log-entry.warn {
      border-left-color: var(--accent3);
      background: rgba(255, 167, 51, 0.04);
    }

    .log-entry.info {
      border-left-color: var(--blue);
      background: rgba(61, 158, 255, 0.04);
    }

    .log-time {
      color: var(--muted);
      flex-shrink: 0;
      font-size: 10px;
    }

    .log-msg {
      color: var(--text);
      word-break: break-word;
    }

    .log-msg .tag {
      display: inline-block;
      padding: 0 4px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 700;
      margin-right: 4px;
      letter-spacing: 0.5px;
    }

    .tag-ok {
      background: rgba(0, 229, 160, 0.15);
      color: var(--accent);
    }

    .tag-err {
      background: rgba(255, 77, 106, 0.15);
      color: var(--accent2);
    }

    .tag-warn {
      background: rgba(255, 167, 51, 0.15);
      color: var(--accent3);
    }

    .tag-info {
      background: rgba(61, 158, 255, 0.15);
      color: var(--blue);
    }

    .tag-ws {
      background: rgba(192, 132, 252, 0.15);
      color: #c084fc;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e8e8e8;
    }

    #mapHint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 12, 16, 0.85);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      color: var(--muted);
      font-size: 12px;
      padding: 10px 18px;
      border-radius: 20px;
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }

    #mapHint span {
      color: var(--accent);
    }

    .hint-text {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      margin-top: 6px;
    }

    .ws-status {
      font-size: 9px;
      color: var(--muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ws-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--dim);
    }

    .ws-indicator.connected {
      background: var(--accent);
      box-shadow: 0 0 5px var(--accent);
    }

    .ws-indicator.disconnected {
      background: var(--accent2);
    }
  </style>
</head>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ─── Sim State ────────────────────────────────────────────────
    let startMarker, stopMarker, driverMarker, routeLine;
    let simulationInterval, dataInterval;
    let progress = 0, isSimulating = false, pingCount = 0, markerStep = 0;
    let routeCoords = [], routeTick = 0;

    // ─── WebSocket State ──────────────────────────────────────────
    let socket = null;
    let wsConnected = false;

    // ─── Map ──────────────────────────────────────────────────────
    const map = L.map('map', { zoomControl: false }).setView([27.6710, 85.3120], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    setTimeout(() => map.invalidateSize(), 200);

    // ─── Icons ────────────────────────────────────────────────────
    const mkIcon = (color, size, label) => L.divIcon({
      className: '',
      html: `<div style="position:relative;width:${size}px;height:${size}px;background:${color};border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid rgba(255,255,255,0.8);box-shadow:0 0 12px ${color}88;"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:rotate(45deg);font-size:${Math.floor(size * 0.35)}px;font-weight:800;color:rgba(0,0,0,0.8);font-family:'Barlow Condensed',sans-serif;">${label}</div></div>`,
      iconSize: [size, size], iconAnchor: [size / 2, size], popupAnchor: [0, -size],
    });
    const driverIcon = L.divIcon({
      className: '',
      html: `<div style="position:relative;width:28px;height:28px;"><div style="width:28px;height:28px;background:#3d9eff;border-radius:50%;border:3px solid white;box-shadow:0 0 0 3px rgba(61,158,255,0.3),0 4px 16px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;font-size:13px;">🚛</div></div>`,
      iconSize: [28, 28], iconAnchor: [14, 14],
    });

    // ─── Map click ────────────────────────────────────────────────
    map.on('click', (e) => {
      if (isSimulating) { addLog('warn', 'Stop simulation before moving markers'); return; }
      if (markerStep === 0) {
        startMarker = L.marker(e.latlng, { icon: mkIcon('#00e5a0', 30, 'S'), draggable: true }).addTo(map).bindPopup('<b style="color:#00e5a0">START</b>');
        startMarker.on('drag', updateRoute);
        markerStep = 1;
        updateHint('Now click to place <span>② Stop</span> (delivery) marker');
        addLog('info', '📍 Start marker placed');
      } else if (markerStep === 1) {
        stopMarker = L.marker(e.latlng, { icon: mkIcon('#ff4d6a', 30, 'D'), draggable: true }).addTo(map).bindPopup('<b style="color:#ff4d6a">DELIVERY</b>');
        stopMarker.on('drag', updateRoute);
        markerStep = 2;
        updateRoute();
        addLog('ok', '📍 Stop marker placed — fetching road route...');
      }
    });

    async function updateRoute() {
      if (!startMarker || !stopMarker) return;
      const s = startMarker.getLatLng(), e = stopMarker.getLatLng();
      if (routeLine) { routeLine.setLatLngs([s, e]); }
      else { routeLine = L.polyline([s, e], { color: '#3d9eff', weight: 3, dashArray: '8,12', opacity: 0.4 }).addTo(map); }
      map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });
      updateHint('⏳ Fetching road route...');
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${s.lng},${s.lat};${e.lng},${e.lat}?overview=full&geometries=geojson&steps=false`;
        const data = await fetch(url).then(r => r.json());
        if (data.code !== 'Ok' || !data.routes?.length) throw new Error('No route');
        const route = data.routes[0];
        routeCoords = route.geometry.coordinates.map(([lng, lat]) => ({ lat, lng }));
        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.polyline(routeCoords, { color: '#3d9eff', weight: 4, opacity: 0.75 }).addTo(map);
        map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });
        addLog('ok', `Road route loaded — ${routeCoords.length} waypoints`);
        updateHint('Markers set. Press <span>▶ Start</span> to begin');
      } catch (err) {
        routeCoords = [s, e];
        addLog('warn', `OSRM unavailable — straight line fallback`);
        updateHint('Markers set. Press <span>▶ Start</span> (straight line fallback)');
      }
      routeTick = 0;
    }

    // ─── Helpers ──────────────────────────────────────────────────
    function haversineKm(lat1, lng1, lat2, lng2) {
      const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
    function calcHeading(a, b) {
      const la1 = a.lat * Math.PI / 180, lo1 = a.lng * Math.PI / 180, la2 = b.lat * Math.PI / 180, lo2 = b.lng * Math.PI / 180, dlo = lo2 - lo1;
      const y = Math.sin(dlo) * Math.cos(la2), x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dlo);
      return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
    }
    function fmtTime(d) { return new Date(d).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
    function fmtEta(d) { const diff = Math.round((new Date(d) - Date.now()) / 60000); if (diff <= 0) return 'NOW'; if (diff < 60) return `${diff}m`; return `${Math.floor(diff / 60)}h ${diff % 60}m`; }
    function updateHint(html) { document.getElementById('mapHint').innerHTML = html; }
    function getHeaders() {
      return { 'Content-Type': 'application/json', 'x-tenant-id': document.getElementById('tenantId').value, 'Authorization': document.getElementById('authToken').value };
    }

    // ─── Log feed ─────────────────────────────────────────────────
    function addLog(type, msg) {
      const feed = document.getElementById('logFeed');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      const tagMap = { ok: 'OK', error: 'ERR', warn: 'WARN', info: 'INFO', ws: 'WS' };
      const tagClass = type === 'ok' ? 'ok' : type === 'error' ? 'err' : type === 'warn' ? 'warn' : type === 'ws' ? 'ws' : 'info';
      entry.innerHTML = `<span class="log-time">${fmtTime(new Date())}</span><span class="log-msg"><span class="tag tag-${tagClass}">${tagMap[type] || 'INFO'}</span>${msg}</span>`;
      feed.insertBefore(entry, feed.firstChild);
      while (feed.children.length > 100) feed.removeChild(feed.lastChild);
    }
    function setStatus(type, html) { const el = document.getElementById('statusCard'); el.className = type; el.innerHTML = html; }

    function updateWsStatus(connected, msg) {
      const ind = document.getElementById('wsIndicator');
      const txt = document.getElementById('wsIndicatorText');
      const topTxt = document.getElementById('wsStatusText');
      if (connected) {
        ind.className = 'ws-indicator connected';
        txt.textContent = msg || 'Connected';
        txt.style.color = 'var(--accent)';
        topTxt.textContent = 'CONNECTED';
        topTxt.style.color = 'var(--accent)';
      } else {
        ind.className = 'ws-indicator disconnected';
        txt.textContent = msg || 'Disconnected';
        txt.style.color = 'var(--accent2)';
        topTxt.textContent = 'DISCONNECTED';
        topTxt.style.color = 'var(--accent2)';
      }
    }

    // ─── WebSocket Logic ──────────────────────────────────────────

        addLog('error', 'WS Error occurred');
        setStatus('error', '❌ WS Error');
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'ack') {
            addLog('ok', `✅ ACK received | StreamID: ${data.data?.stream_id || 'N/A'}`);
          } else if (data.type === 'error') {
            addLog('error', `Server Error: ${data.data?.reason || 'Unknown'}`);
            setStatus('error', `⚠️ ${data.data?.reason}`);
          } else if (data.type === 'eta_update') {
            addLog('info', `🕒 ETA Update: ${data.payload?.etaMinutes} mins`);
          }
        } catch (e) {
          console.error("Failed to parse WS message", e);
        }
      };
    }

    // ─── Send ping via WebSocket ──────────────────────────────────
    async function sendPing() {
      if (!driverMarker || !stopMarker || !routeCoords.length) return;
      if (!wsConnected) {
        addLog('error', 'Cannot send ping: WebSocket not connected');
        setStatus('error', '❌ WS Disconnected');
        return;
      }

      const pos = driverMarker.getLatLng();
      const stop = stopMarker.getLatLng();
      const apptISO = new Date(document.getElementById('localAppointment').value).toISOString();
      const nextWpt = routeCoords[Math.min(routeTick + 1, routeCoords.length - 1)];
      const heading = Math.round(calcHeading(pos, nextWpt));
      const speedKmh = 25 + Math.random() * 15;

      const payload = {
        type: 'location_ping',
        payload: {
          trip_id: document.getElementById('tripId').value,
          lat: pos.lat,
          lng: pos.lng,
          speed_kmh: Math.round(speedKmh * 10) / 10,
          heading: heading,
          accuracy_metres: 5.0,
          eta_source: 'GPS_AUTO',
          next_stop: {
            stop_id: document.getElementById('stopId').value,
            lat: stop.lat,
            lng: stop.lng,
            address: "Patan Durbar Square, Lalitpur",
            appointment_time: apptISO,
            type: 'delivery',
          },
        }
      };

      document.getElementById('statSpeed').textContent = `${payload.payload.speed_kmh} km/h`;
      const distRemaining = haversineKm(pos.lat, pos.lng, stop.lat, stop.lng);
      const travelMins = distRemaining > 0 ? (distRemaining / speedKmh) * 60 : 0;
      const etaDate = new Date(Date.now() + travelMins * 60000);
      document.getElementById('statEta').textContent = fmtEta(etaDate);

      // Send via WebSocket
      socket.send(JSON.stringify(payload));
      pingCount++;
      document.getElementById('statPings').textContent = pingCount;
      // Note: We wait for the 'ack' message in onmessage to confirm success
    }

    // ─── Simulation tick ──────────────────────────────────────────
    function tickSimulation() {
      if (!routeCoords.length) return;
      const steps = Math.max(1, Math.floor(parseInt(document.getElementById('simSpeed').value) / 10));
      routeTick += steps;
      if (routeTick >= routeCoords.length - 1) {
        routeTick = routeCoords.length - 1;
        if (driverMarker) driverMarker.setLatLng(routeCoords[routeTick]);
        stopTracking();
        setStatus('ok', '🏁 Driver arrived — simulation complete');
        addLog('ok', '🏁 Arrived at destination');
        document.getElementById('statProgress').textContent = '100%';
        document.getElementById('progressBar').style.width = '100%';
        return;
      }
      const pos = routeCoords[routeTick];
      if (!driverMarker) driverMarker = L.marker(pos, { icon: driverIcon }).addTo(map);
      else driverMarker.setLatLng(pos);
      const pct = Math.round((routeTick / (routeCoords.length - 1)) * 100);
      progress = routeTick / (routeCoords.length - 1);
      document.getElementById('statProgress').textContent = `${pct}%`;
      document.getElementById('progressBar').style.width = `${pct}%`;
    }

    // ─── Start / Stop / Reset ─────────────────────────────────────
    function startTracking() {
      if (markerStep < 2) { addLog('warn', 'Place both markers first'); setStatus('warn', '⚠️ Place Start and Stop markers first'); return; }
      if (!routeCoords.length) { addLog('warn', 'Route still loading'); setStatus('warn', '⏳ Route still loading...'); return; }
      if (isSimulating) return;

      // Initialize Socket Connection First
      initSocket();

      if (driverMarker) map.removeLayer(driverMarker);
      driverMarker = L.marker(routeCoords[0], { icon: driverIcon }).addTo(map);
      routeTick = 0; progress = 0; pingCount = 0;
      isSimulating = true;
      document.getElementById('liveDot').classList.add('active');
      document.getElementById('liveLabel').textContent = 'LIVE';
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'block';

      updateHint('🚛 Simulation running — driver en route');
      simulationInterval = setInterval(tickSimulation, 100);

      // Wait briefly for WS connect then start pinging
      setTimeout(() => {
        if (wsConnected) {
          const ms = Math.max(parseFloat(document.getElementById('intervalMins').value) * 60000, 2000);
          sendPing();
          dataInterval = setInterval(sendPing, ms);
          addLog('info', `Started — WS Ping interval: ${ms / 1000}s`);
        } else {
          addLog('error', 'Could not start: WebSocket failed to connect');
          setStatus('error', '❌ WS Connection Failed');
        }
      }, 1000);

      setStatus('ok', '🚀 Simulation started (WS Mode)');
    }

    function stopTracking() {
      clearInterval(simulationInterval);
      clearInterval(dataInterval);
      isSimulating = false;
      if (socket) {
        socket.close();
        socket = null;
      }
      wsConnected = false;
      updateWsStatus(false, 'Stopped');
      document.getElementById('liveDot').classList.remove('active');
      document.getElementById('liveLabel').textContent = 'PAUSED';
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';
      updateHint('Paused — press <span>▶ Start</span> to resume');
      addLog('warn', 'Simulation paused');
    }

    function resetAll() {
      stopTracking();
      [startMarker, stopMarker, driverMarker, routeLine].forEach(m => { if (m) try { map.removeLayer(m) } catch (_) { } });
      startMarker = stopMarker = driverMarker = routeLine = null;
      markerStep = 0; progress = 0; pingCount = 0; routeCoords = []; routeTick = 0;
      document.getElementById('statProgress').textContent = '0%';
      document.getElementById('statPings').textContent = '0';
      document.getElementById('statEta').textContent = '—';
      document.getElementById('statSpeed').textContent = '— km/h';
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('liveLabel').textContent = 'IDLE';
      setStatus('', 'Click map to place <span style="color:var(--accent)">Start</span> then <span style="color:var(--accent2)">Stop</span> markers');
      updateHint('Click map → set <span>① Start</span> then <span>② Stop</span> marker');
      addLog('info', 'Reset — all cleared');
    }

    document.getElementById('simSpeed').addEventListener('input', e => { document.getElementById('speedLabel').textContent = e.target.value + 'x'; });
    const d = new Date(Date.now() + 3600000);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    document.getElementById('localAppointment').value = d.toISOString().slice(0, 16);
    document.addEventListener('keydown', e => {
      if (e.key === ' ' && !e.target.matches('input,select')) { e.preventDefault(); isSimulating ? stopTracking() : startTracking(); }
    });

    addLog('info', 'Simulator ready (WS Mode) — click map to place markers');
  </script>
